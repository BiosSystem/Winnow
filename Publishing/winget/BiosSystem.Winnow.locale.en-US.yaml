ShortDescription: Windows 11 debloat, telemetry, and privacy hardening toolkit.
Description: >-
  Winnow is a modular Windows 11 configuration, debloat, and privacy hardening
  toolkit for 24H2 and 25H2. It removes preinstalled apps, disables telemetry
  and AI features such as Recall and Copilot, and applies privacy policy
  settings, with a WPF interface and a command line. Changes are verifiable
  through the desired-state modes and are rolled back automatically when an
  apply fails. It does not delete system binaries, so Windows Update and
  anti-cheat drivers keep working.
